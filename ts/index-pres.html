<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presentation</title>
  <link rel="stylesheet" href="/styles/editor.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: system-ui, sans-serif; display: flex; align-items: safe center; justify-content: center; }
    #pres { width: 100%; max-width: 1100px; padding: 32px; }
    .slide { min-height: 70vh; display: flex; flex-direction: column; position: relative; }
    .slide-number { position: absolute; bottom: 0; right: 0; font-size: 14px; opacity: 0.45; user-select: none; }
    .help-button { position: absolute; top: 0; right: 0; padding: 4px 10px; border-radius: 6px;
      font: inherit; font-size: 15px; line-height: 1; cursor: pointer; background: transparent; color: #000; opacity: 0.75; }
    .help-button:hover { opacity: 1; }
    .help-button .help-q { color: #d0c; }
    .help-overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.55); }
    .help-overlay[hidden] { display: none; }
    .help-panel { min-width: 320px; max-width: 90vw; padding: 24px 28px; border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35); }
    .help-title { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
    .help-table { border-collapse: collapse; font-size: 16px; }
    .help-table td { padding: 4px 12px 4px 0; vertical-align: top; }
    .help-key { font-family: monospace; white-space: nowrap; opacity: 0.85; }
    .help-hint { margin-top: 16px; font-size: 13px; opacity: 0.6; }
    .slide-title, .title-line { font-size: 36px; font-weight: 600; margin-bottom: 24px; }
    .title-slide { align-items: center; justify-content: center; text-align: center; }
    .title-slide .title-line { font-size: 56px; }
    .meta-author { margin-top: 12px; font-size: 22px; }
    .meta-date   { margin-top: 8px; font-size: 18px; }
    .slide-body { font-size: 22px; line-height: 1.55; }
    .block.para { margin: 14px 0; }
    .block.list { margin: 14px 0 14px 24px; }
    .block.list li { margin: 8px 0; }
    .block.code { margin: 18px 0; border-radius: 6px; overflow: hidden; }
    .slide-body code { font-family: monospace; font-size: 0.92em; padding: 1px 5px; border-radius: 3px; }
    body.mode-light .slide-body code { background: #ececec; color: #2a2a2a; }
    body.mode-dark  .slide-body code { background: #2a2a2a; color: #d4d4d4; }
    .pres-editor-host { padding: 0; color: inherit; }
    .pres-editor-toolbar { display: flex; gap: 6px; padding: 6px 12px; font-size: 12px; }
    .pres-toggle { font: inherit; padding: 2px 10px; border-radius: 4px; cursor: pointer; background: transparent; }
    body.mode-light .pres-toggle { color: #555; border: 1px solid #d0d0c8; }
    body.mode-light .pres-toggle.active { background: #e8e8e0; color: #222; border-color: #b5b5ac; }
    body.mode-dark  .pres-toggle { color: #aaa; border: 1px solid #333; }
    body.mode-dark  .pres-toggle.active { background: #2a2a2a; color: #e8e8e8; border-color: #555; }
    /* Editor structural rules come from /styles/editor.css. Host overrides: */
    .pres-editor-host .editor-wrap {
      --editor-font-size: 16px;
      --editor-line-height: 1.45;
      --editor-gutter-pad: 14px 6px 14px 12px;
      --editor-gutter-fg: rgba(0,0,0,0.35);
      --editor-gutter-border: rgba(0,0,0,0.2);
    }
    .pres-editor-host .editor-textarea {
      border: none; outline: none; background: transparent;
      color: inherit; display: block;
      padding-top: 14px; padding-right: 16px; padding-bottom: 14px;
    }
    body.mode-dark .pres-editor-host .editor-wrap {
      --editor-gutter-fg: rgba(255,255,255,0.4);
      --editor-gutter-border: rgba(255,255,255,0.25);
    }
    .pres-output { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 12px; border-top: 1px solid rgba(0,0,0,0.08); }
    .pres-output-tuples { font-family: monospace; font-size: 13px; line-height: 1.45; white-space: pre; overflow-x: auto; }
    .pres-output-timeline { overflow-x: auto; }
    .pres-output-timeline .timeline-svg { display: block; }
    body.mode-light .pres-output-timeline .timeline-svg { color: #444; }
    body.mode-dark  .pres-output-timeline .timeline-svg { color: #c8c8c8; }
    .pres-eval-error { color: #c0392b; font-family: monospace; font-size: 13px; padding: 4px 0; }
    .frag.hidden-frag { visibility: hidden; }
    .empty { opacity: 0.6; }
    /* DB pane class colors. Theme-scoped below. */
    .pres-output-tuples .group-heading { display: block; margin-top: 6px; opacity: 0.7; }
    .pres-output-tuples .pred { font-weight: 600; }
    .pres-output-tuples .var { opacity: 0.8; }
    .pres-output-tuples .interval { opacity: 0.55; }

    /* Light mode (default) */
    body.mode-light { background: #fdfdfd; color: #1a1a1a; }
    body.mode-light .slide-title, body.mode-light .title-line { color: #111; }
    body.mode-light .meta-author { color: #555; }
    body.mode-light .meta-date   { color: #777; }
    body.mode-light .block.code { background: #f3f3f0; border: 1px solid #e0e0db; color: #2a2a2a; }
    body.mode-light .help-button { border: 1px solid #d0d0c8; }
    body.mode-light .help-panel { background: #fdfdfd; color: #1a1a1a; border: 1px solid #e0e0db; }

    /* Dark mode */
    body.mode-dark { background: #1a1a1a; color: #e8e8e8; }
    body.mode-dark .slide-title, body.mode-dark .title-line { color: #fff; }
    body.mode-dark .meta-author { color: #aaa; }
    body.mode-dark .meta-date   { color: #888; }
    body.mode-dark .block.code { background: #111; border: 1px solid #2a2a2a; color: #d4d4d4; }
    body.mode-dark .pres-output { border-top-color: rgba(255,255,255,0.1); }
    body.mode-dark .pres-output-tuples { color: #c8c8c8; }
    body.mode-dark .pres-eval-error { color: #f87171; }
    body.mode-dark .help-button { border: 1px solid #333; }
    body.mode-dark .help-panel { background: #1f1f1f; color: #e8e8e8; border: 1px solid #2a2a2a; }
  </style>
</head>
<body class="mode-light">
  <div id="pres"></div>
  <script type="module" src="/src/pres/main.js"></script>
</body>
</html>
