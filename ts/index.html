<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: monospace;
      background: #1a1a1a;
      color: #d4d4d4;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 8px 16px;
      background: #252525;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 {
      font-size: 14px;
      font-weight: normal;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #file-name {
      font-size: 13px;
      color: #aaa;
    }

    #sync-status {
      font-size: 13px;
      margin-left: 4px;
    }

    #error-bar {
      color: #555;
      font-size: 10px;
      font-style: italic;
    }

    #error-bar.has-error {
      color: #f87171;
      font-style: normal;
    }

    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      min-height: 0;
    }

    .editors {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #333;
      min-height: 0;
    }

    .pane {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .pane + .pane {
      border-top: 1px solid #333;
    }

    .pane-label {
      padding: 5px 12px;
      font-size: 11px;
      color: #666;
      background: #1e1e1e;
      border-bottom: 1px solid #2a2a2a;
      letter-spacing: 1px;
      text-transform: uppercase;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    textarea {
      flex: 1;
      background: #1a1a1a;
      color: #d4d4d4;
      border: none;
      outline: none;
      padding: 12px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      resize: none;
      tab-size: 2;
      white-space: nowrap;
      overflow-x: auto;
    }

    textarea:focus {
      background: #1c1c1c;
    }

    .right-column {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .right-column.has-display .result-pane {
      flex: 1;
      border-bottom: 1px solid #333;
    }

    .right-column.has-display .display-pane {
      flex: 1;
    }

    .result-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
    }

    .result-pane .pane-label,
    .editors .pane-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .display-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .display-pane .pane-label {
      padding: 5px 12px;
      font-size: 11px;
      color: #666;
      background: #1e1e1e;
      border-bottom: 1px solid #2a2a2a;
      letter-spacing: 1px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    #display {
      flex: 1;
      overflow: auto;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #iterations {
      color: #555;
      font-size: 10px;
      font-style: italic;
    }

    #result {
      flex: 1;
      overflow: auto;
      padding: 12px;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre;
      color: #fff;
    }

    .lit-match    { color: #fff; }
    .lit-before   { color: #fff; }
    .lit-assert   { color: #fff; }
    .lit-ask      { color: #fff; }
    .lit-constrain { color: #fff; }
    .lit-symbol   { color: #fff; }
    .lit-variable { color: #4fc1ff; }
    .lit-wildcard { color: #fff; }
    .lit-predicate { color: #f5a623; }

    .node-clickable { cursor: pointer; }
    .node-selected  { background: #3a3a1a; outline: 1px solid #dcdcaa; border-radius: 2px; }

    /* Source-output linking */
    .source-highlight {
      background-color: rgba(59, 130, 246, 0.3);
      border-radius: 2px;
    }

    .hover-highlight {
      background-color: rgba(168, 85, 247, 0.3);
      border-radius: 2px;
    }

    .source-line-highlight {
      position: absolute;
      left: 0;
      right: 0;
      background-color: rgba(59, 130, 246, 0.25);
      pointer-events: none;
      z-index: 1;
      display: none;
    }

    .pane {
      position: relative;
    }

    textarea {
      position: relative;
      z-index: 2;
      background: transparent;
    }

    .pane::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #1a1a1a;
      z-index: 0;
      pointer-events: none;
    }

    textarea:focus {
      background: transparent;
    }

    .pane:has(textarea:focus)::before {
      background: #1c1c1c;
    }

    /* TTT board display */
    .ttt-board {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .ttt-grid {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      gap: 2px;
      background: #333;
      padding: 2px;
    }

    .ttt-cell {
      background: #1e1e1e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
    }

    .ttt-empty {
      cursor: pointer;
    }

    .ttt-empty:hover {
      background: #2a2a2a;
    }

    .ttt-mark-x {
      color: #4ade80;
    }

    .ttt-mark-o {
      color: #f87171;
    }

    .ttt-status {
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <h1>Slide</h1>
    <span id="file-name"></span>
    <span id="sync-status"></span>
  </header>
  <div class="workspace">
    <div class="editors">
      <div class="pane">
        <div class="pane-label">
          <span id="error-bar">no issues</span>
        </div>
        <textarea id="patterns" spellcheck="false"></textarea>
      </div>
    </div>
    <div class="right-column">
      <div class="result-pane">
        <div class="pane-label">
          <span>Result</span>
          <span id="iterations"></span>
        </div>
        <div id="result"></div>
      </div>
      <div class="display-pane" id="display-pane" style="display: none;">
        <div class="pane-label">Display</div>
        <div id="display"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/web.js"></script>
</body>
</html>
