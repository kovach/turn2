<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide v2</title>
  <style>
    /* Theme palette */
    html.mode-dark {
      --bg: #1a1a1a; --bg-2: #1e1e1e; --bg-3: #252525;
      --fg: #d4d4d4; --fg-mute: #aaa; --fg-mute2: #888; --fg-faint: #666;
      --border: #333; --border-2: #2a2a2a; --hover: #2a2a2a;
      --syn-head: #4fc1ff; --syn-ref: #c586c0; --syn-sym: #d4d4d4;
      --syn-pred: #4ec9b0; --syn-var: #dcdcaa;
      --syn-interval: #666; --syn-group: #888;
      --err: #f87171; --link: #4fc1ff;
    }
    html.mode-light {
      --bg: #fdfdfd; --bg-2: #f5f5f0; --bg-3: #ebebe5;
      --fg: #1a1a1a; --fg-mute: #555; --fg-mute2: #666; --fg-faint: #888;
      --border: #d0d0c8; --border-2: #e0e0db; --hover: #e8e8e0;
      --syn-head: #0a64a4; --syn-ref: #8a3398; --syn-sym: #1a1a1a;
      --syn-pred: #007a5a; --syn-var: #885a00;
      --syn-interval: #999; --syn-group: #777;
      --err: #c0392b; --link: #0a64a4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; }
    header { padding: 8px 16px; background: var(--bg-3); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 14px; font-weight: normal; color: var(--fg-mute2); letter-spacing: 2px; text-transform: uppercase; }
    #file-name { font-size: 13px; color: var(--fg-mute); }
    #status-line { font-size: 12px; color: var(--fg-mute2); margin-left: auto; }
    #status-line.error { color: var(--err); }
    #theme-toggle { background: transparent; color: var(--fg-mute2); border: 1px solid var(--border); padding: 3px 10px; font-family: monospace; font-size: 11px; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; }
    #theme-toggle:hover { color: var(--fg); }
    .workspace { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
    .pane { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .pane-label { padding: 5px 12px; font-size: 11px; color: var(--fg-faint); background: var(--bg-2); border-bottom: 1px solid var(--border-2); letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
    textarea { flex: 1; background: var(--bg); color: var(--fg); border: none; outline: none; padding: 12px; font-family: monospace; font-size: 14px; line-height: 1.6; resize: none; tab-size: 2; white-space: pre; }
    .editors { display: flex; flex-direction: column; border-right: 1px solid var(--border); min-height: 0; }
    .right-column { display: flex; flex-direction: column; min-height: 0; }
    .display-pane { flex: 1; display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid var(--border); }
    #display { flex: 1; overflow: auto; padding: 12px; display: flex; align-items: flex-start; justify-content: center; }
    .db-pane { flex: 0 0 40%; display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid var(--border); }
    #db { flex: 1; overflow: auto; padding: 8px 12px; font-size: 12px; line-height: 1.4; white-space: pre; color: var(--fg); font-family: monospace; }
    #db .head { color: var(--syn-head); }
    #db .interval { color: var(--syn-interval); }
    #db .ref { color: var(--syn-ref); }
    #db .sym { color: var(--syn-sym); }
    #db .pred { color: var(--syn-pred); }
    #db .var { color: var(--syn-var); }
    #db .group-heading { color: var(--syn-group); margin-top: 6px; }
    .info-pane { flex: 0 0 200px; display: flex; flex-direction: column; min-height: 0; }
    #info { flex: 1; overflow: auto; padding: 8px 12px; font-size: 12px; line-height: 1.4; white-space: pre-wrap; color: var(--fg-mute); }
    #info .err { color: var(--err); }
    #info .opt { color: var(--link); cursor: pointer; }
    #info .opt:hover { background: var(--hover); }
    /* Tabs */
    .tabs { display: flex; gap: 4px; }
    .tab-btn { background: transparent; color: var(--fg-mute2); border: 1px solid var(--border); padding: 3px 10px; font-family: monospace; font-size: 11px; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; }
    .tab-btn:hover { color: var(--fg); }
    .tab-btn.active { background: var(--hover); color: var(--fg); border-color: var(--fg-faint); }
    .tab-pane.hidden { display: none !important; }
    /* Timeline */
    #timeline-tab { flex: 1; display: flex; flex-direction: row; min-height: 0; }
    #timeline-content { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    #timeline-toolbar { padding: 6px 12px; background: var(--bg-2); border-bottom: 1px solid var(--border-2); font-size: 11px; color: var(--fg-mute2); display: flex; gap: 8px; align-items: center; }
    #timeline-toolbar button { background: transparent; color: var(--fg-mute2); border: 1px solid var(--border); padding: 2px 8px; font-family: monospace; font-size: 11px; cursor: pointer; }
    #timeline-toolbar button.active { background: var(--hover); color: var(--fg); border-color: var(--fg-faint); }
    #timeline-main { flex: 1; overflow-x: auto; overflow-y: auto; padding: 12px; min-width: 0; }
    .timeline-svg { display: block; color: var(--fg); }
    #timeline-sidebar-host { flex: 0 0 280px; overflow: auto; border-left: 1px solid var(--border); background: var(--bg-2); padding: 4px 0; }
    .timeline-sidebar-heading { color: var(--fg-mute2); font-size: 11px; padding: 8px 12px 4px; letter-spacing: 1px; text-transform: uppercase; }
    .timeline-sidebar-row { color: var(--fg); font-family: monospace; font-size: 12px; padding: 2px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .timeline-sidebar-row:hover { background: var(--hover); }
    /* Source ↔ output linking */
    .editors .pane { position: relative; }
    #db .row { display: inline-block; line-height: inherit; }
    #db .row[data-source-line] { cursor: pointer; }
    #db .row.source-highlight { background-color: rgba(59, 130, 246, 0.30); }
    #db .row.hover-highlight  { background-color: rgba(168, 85, 247, 0.30); }
    .source-line-highlight {
      position: absolute;
      left: 0;
      right: 0;
      background-color: rgba(59, 130, 246, 0.25);
      pointer-events: none;
      z-index: 1;
      display: none;
    }
    .editors .pane { background: var(--bg); }
    .editors textarea { background: transparent; position: relative; z-index: 2; }
    .source-symbol-overlay {
      position: absolute;
      padding: 12px;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.6;
      tab-size: 2;
      white-space: pre;
      color: transparent;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .source-symbol-overlay mark {
      background-color: rgba(255, 200, 0, 0.30);
      color: transparent;
      border-radius: 2px;
    }
  </style>
  <script>
    (function() {
      var saved = "dark";
      try { var s = localStorage.getItem("v2-theme"); if (s === "light" || s === "dark") saved = s; } catch (e) {}
      document.documentElement.classList.add("mode-" + saved);
    })();
  </script>
</head>
<body>
  <header>
    <h1>Slide v2</h1>
    <span id="file-name"></span>
    <span class="tabs">
      <button class="tab-btn active" id="tab-editor" data-tab="editor">Editor</button>
      <button class="tab-btn" id="tab-timeline" data-tab="timeline">Timeline</button>
    </span>
    <span id="status-line">—</span>
    <button id="theme-toggle" type="button" title="Toggle light/dark">Theme</button>
    <script>
      document.getElementById("theme-toggle").addEventListener("click", function() {
        var h = document.documentElement;
        var light = h.classList.toggle("mode-light");
        h.classList.toggle("mode-dark", !light);
        try { localStorage.setItem("v2-theme", light ? "light" : "dark"); } catch (e) {}
      });
    </script>
  </header>
  <div class="workspace tab-pane" id="editor-tab">
    <div class="editors">
      <div class="pane">
        <div class="pane-label"><span>Source (.t)</span><span id="source-cursor-line" style="font-size: 11px; color: #888;"></span></div>
        <textarea id="source" spellcheck="false"></textarea>
      </div>
    </div>
    <div class="right-column">
      <div class="display-pane">
        <div class="pane-label"><span>Display</span></div>
        <div id="display"></div>
      </div>
      <div class="db-pane">
        <div class="pane-label"><span>Database</span><label style="font-size: 11px; color: #888;"><input type="checkbox" id="hide-internal" checked /> hide internal</label><label style="font-size: 11px; color: #888; margin-left: 8px;"><input type="checkbox" id="db-temporal" checked /> temporal</label></div>
        <div id="db"></div>
      </div>
      <div class="info-pane">
        <div class="pane-label"><span>Info</span></div>
        <div id="info"></div>
      </div>
    </div>
  </div>
  <div class="tab-pane hidden" id="timeline-tab">
    <div id="timeline-content">
      <div id="timeline-toolbar">
        <span>orientation:</span>
        <button id="timeline-orient-h" class="active">horizontal</button>
        <button id="timeline-orient-v">vertical</button>
      </div>
      <div id="timeline-main"></div>
    </div>
    <div id="timeline-sidebar-host"></div>
  </div>
  <script type="module" src="/src/web-v2.js"></script>
</body>
</html>
