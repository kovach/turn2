<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turn Tool</title>
  <link rel="stylesheet" href="/styles/theme.css" />
  <link rel="stylesheet" href="/styles/editor.css" />
  <style>
    /* Theme palette + linking/timeline styles come from /styles/theme.css. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 8px 16px; background: var(--bg-3); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 14px; font-weight: normal; color: var(--fg-mute2); letter-spacing: 2px; text-transform: uppercase; }
    #file-name { font-size: 13px; color: var(--fg-mute); }
    #status-line { font-size: 12px; color: var(--fg-mute2); margin-left: auto; }
    #status-line.error { color: var(--err); }
    #theme-toggle { background: transparent; color: var(--fg-mute2); border: 1px solid var(--border); padding: 3px 10px; font-family: monospace; font-size: 11px; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; }
    #theme-toggle:hover { color: var(--fg); }
    .workspace { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
    .pane { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .pane-label { padding: 5px 12px; font-size: 11px; color: var(--fg-faint); background: var(--bg-2); border-bottom: 1px solid var(--border-2); letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
    /* Editor structural rules come from /styles/editor.css. Host overrides are
     * set on .editors (not .editor-wrap) so the source-symbol-overlay sibling
     * inherits the same values. */
    .editors {
      --editor-gutter-pad: 12px 6px 12px 10px;
      --editor-gutter-fg: var(--fg-faint);
      --editor-gutter-bg: var(--bg);
      --editor-gutter-border: var(--fg-faint);
    }
    .editor-wrap { flex: 1; min-height: 0; background: var(--bg); }
    .editor-wrap .editor-textarea {
      background: var(--bg); color: var(--fg);
      border: none; outline: none; resize: none;
      padding-top: 12px; padding-right: 12px; padding-bottom: 12px;
    }
    .editors { display: flex; flex-direction: column; border-right: 1px solid var(--border); min-height: 0; }
    .right-column { display: flex; flex-direction: column; min-height: 0; }
    .display-pane { flex: 1; display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid var(--border); }
    #display { flex: 1; overflow: auto; padding: 12px; display: flex; align-items: flex-start; justify-content: center; }
    .db-pane { flex: 0 0 40%; display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid var(--border); }
    #db { flex: 1; overflow: auto; padding: 8px 12px; font-size: 12px; line-height: 1.4; white-space: pre; color: var(--fg); font-family: monospace; }
    #db .head { color: var(--syn-head); }
    #db .interval { color: var(--syn-interval); }
    #db .ref { color: var(--syn-ref); }
    #db .sym { color: var(--syn-sym); }
    #db .pred { color: var(--syn-pred); }
    #db .var { color: var(--syn-var); }
    #db .group-heading { color: var(--syn-group); margin-top: 6px; }
    .info-pane { flex: 0 0 200px; display: flex; flex-direction: column; min-height: 0; }
    #info { flex: 1; overflow: auto; padding: 8px 12px; font-size: 12px; line-height: 1.4; white-space: pre-wrap; color: var(--fg-mute); }
    #info .err { color: var(--err); }
    #info .opt { color: var(--link); cursor: pointer; }
    #info .opt:hover { background: var(--hover); }
    /* Db-pane view toggle (Database / Timeline) */
    .db-view-toggle { display: flex; gap: 4px; }
    .db-view-btn { background: transparent; color: var(--fg-mute2); border: 1px solid var(--border); padding: 2px 8px; font-family: monospace; font-size: 11px; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; }
    .db-view-btn:hover { color: var(--fg); }
    .db-view-btn.active { background: var(--hover); color: var(--fg); border-color: var(--fg-faint); }
    .hidden { display: none !important; }
    /* Timeline rendered inline inside the db pane */
    #timeline-inline { flex: 1; overflow: auto; padding: 12px; min-width: 0; }
    .timeline-svg { display: block; color: var(--fg); }
    /* Source ↔ output linking: shared rules in /styles/theme.css; the
     * source-side line overlay is .editor-line-highlight in editor.css. */
    .editors .pane { background: var(--bg); }
    #db .row { display: inline-block; line-height: inherit; }
  </style>
  <script>
    (function() {
      var saved = "light";
      try { var s = localStorage.getItem("v2-theme"); if (s === "light" || s === "dark") saved = s; } catch (e) {}
      document.documentElement.classList.add("mode-" + saved);
    })();
  </script>
</head>
<body>
  <header>
    <span id="file-name"></span>
    <span id="status-line">—</span>
    <button id="theme-toggle" type="button" title="Toggle light/dark">Theme</button>
    <script>
      document.getElementById("theme-toggle").addEventListener("click", function() {
        var h = document.documentElement;
        var light = h.classList.toggle("mode-light");
        h.classList.toggle("mode-dark", !light);
        try { localStorage.setItem("v2-theme", light ? "light" : "dark"); } catch (e) {}
      });
    </script>
  </header>
  <div class="workspace">
    <div class="editors">
      <div class="pane">
        <div class="pane-label"><span></span><span id="source-cursor-line" style="font-size: 11px; color: #888;"></span></div>
        <textarea id="source" spellcheck="false"></textarea>
      </div>
    </div>
    <div class="right-column">
      <div class="display-pane">
        <div class="pane-label"><span>Display</span></div>
        <div id="display"></div>
      </div>
      <div class="db-pane">
        <div class="pane-label">
          <span class="db-view-toggle">
            <button type="button" class="db-view-btn active" id="db-view-database">Database</button>
            <button type="button" class="db-view-btn" id="db-view-timeline">Timeline</button>
          </span>
          <span><label style="font-size: 11px; color: #888;"><input type="checkbox" id="hide-internal" checked /> hide internal</label><label style="font-size: 11px; color: #888; margin-left: 8px;"><input type="checkbox" id="db-temporal" checked /> temporal</label></span>
        </div>
        <div id="db"></div>
        <div id="timeline-inline" class="hidden"></div>
      </div>
      <div class="info-pane">
        <div class="pane-label"><span>Info</span></div>
        <div id="info"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/web-v2.js"></script>
</body>
</html>
